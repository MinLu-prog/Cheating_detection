<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIIT | {% block title %}{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome (for icons) -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <!-- Custom Animations -->
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.8s forwards;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body class="min-h-screen flex bg-gradient-to-r from-white to-blue-400 text-gray-900">

{% if user.is_authenticated %}
<!-- ✅ Sidebar -->
<aside id="sidebar" class="w-60 bg-black text-white flex flex-col shadow-lg transform transition-transform duration-300">
    <!-- Logo -->
    <div class="flex items-center justify-between px-6 h-16 border-b border-gray-700">
        <span class="text-lg font-bold">MIIT</span>
        <!-- Close button (for mobile) -->
        <button id="closeSidebar" class="md:hidden text-white hover:text-gray-400">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- Nav Links -->
    <nav class="flex-1 px-4 py-6 space-y-2">
        <a href="{% url 'teacher_dashboard' %}" 
           class="flex items-center px-3 py-2 rounded-lg hover:bg-gray-800 transition">
            <i class="fas fa-tachometer-alt mr-2"></i> Dashboard
        </a>
        <a href="#" 
           class="flex items-center px-3 py-2 rounded-lg hover:bg-gray-800 transition">
            <i class="fas fa-question-circle mr-2"></i> Quizzes
        </a>
    </nav>

    <!-- User Dropdown -->
    <div class="border-t border-gray-700 p-4">
        <div class="relative group">
            <button class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-gray-800 transition">
                <span>{{ request.user.get_full_name|default:request.user.username }}</span>
                <i class="fas fa-chevron-down ml-2"></i>
            </button>
            <div class="absolute bottom-14 left-4 w-48 bg-white text-gray-700 rounded-lg shadow-lg opacity-0 group-hover:opacity-100 transition">
                <a href="#" class="block px-4 py-2 hover:bg-gray-100"><i class="fas fa-user mr-2"></i> Profile</a>
                <div class="border-t"></div>
                <a href="{% url 'logout' %}" class="block px-4 py-2 hover:bg-gray-100"><i class="fas fa-sign-out-alt mr-2"></i> Logout</a>
            </div>
        </div>
    </div>
</aside>
{% endif %}

<!-- ✅ Main Content -->
<div class="flex-1 flex flex-col">
    <!-- Top bar -->
    <header class="flex items-center justify-between bg-black text-white px-4 h-16 shadow-md md:hidden">
        <button id="openSidebar" class="text-white hover:text-gray-400">
            <i class="fas fa-bars"></i>
        </button>
        <h1 class="text-lg font-bold">MIIT</h1>
    </header>

    <main class="flex-1 p-6 overflow-y-auto">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 px-4 py-3 rounded-lg shadow-md text-white 
                    {% if message.tags == 'success' %} bg-green-500 
                    {% elif message.tags == 'warning' %} bg-yellow-500 
                    {% elif message.tags == 'error' or message.tags == 'danger' %} bg-red-500 
                    {% else %} bg-blue-500 {% endif %} animate-fadeIn">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</div>

{% block extra_js %}
<script>
    const sidebar = document.getElementById("sidebar");
    const openSidebar = document.getElementById("openSidebar");
    const closeSidebar = document.getElementById("closeSidebar");

    // Hide sidebar on mobile by default
    if (window.innerWidth < 768) {
        sidebar.classList.add("-translate-x-full");
    }

    openSidebar?.addEventListener("click", () => {
        sidebar.classList.remove("-translate-x-full");
    });

    closeSidebar?.addEventListener("click", () => {
        sidebar.classList.add("-translate-x-full");
    });
</script>
{% endblock %}
</body>
</html>
