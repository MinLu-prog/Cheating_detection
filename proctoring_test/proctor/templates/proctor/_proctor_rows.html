{% for e in events %}
<tr class="border-t hover:bg-gray-50" data-ts="{{ e.created_at|date:'c' }}">
  <td class="px-3 py-2 whitespace-nowrap" title="{{ e.created_at|date:'c' }}">
    {{ e.created_at|timesince }} ago
  </td>
  <td class="px-3 py-2">{{ e.student.username }}</td>
  <td class="px-3 py-2">
    <span class="px-2 py-0.5 rounded bg-gray-100 border">{{ e.event_type }}</span>
  </td>
  <td class="px-3 py-2">
    {% with s=e.severity %}
      <span class="px-2 py-0.5 rounded
        {% if s == 'high' %} bg-red-100 text-red-700 border border-red-200
        {% elif s == 'medium' %} bg-yellow-100 text-yellow-800 border border-yellow-200
        {% else %} bg-green-100 text-green-800 border border-green-200 {% endif %}">
        {{ s|title }}
      </span>
    {% endwith %}
  </td>
  <td class="px-3 py-2 max-w-[40ch] truncate" title="{{ e.message }}">{{ e.message }}</td>
  <td class="px-3 py-2">
    {% if e.frame %}
      <a href="{{ e.frame.url }}" target="_blank" title="Open full image">
        <img src="{{ e.frame.url }}" alt="snap" class="h-12 w-16 object-cover rounded">
      </a>
    {% else %} — {% endif %}
  </td>
</tr>
{% empty %}
<tr><td class="px-3 py-4 text-gray-500" colspan="6">No events yet.</td></tr>
{% endfor %}
