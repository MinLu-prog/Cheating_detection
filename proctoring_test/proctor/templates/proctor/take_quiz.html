{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ quiz.title }} - Take Quiz</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #343a40;
            margin-bottom: 20px;
        }
        .question {
            margin-bottom: 30px;
        }
        .question h4 {
            margin-bottom: 10px;
        }
        .choice {
            margin-bottom: 8px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .note {
            color: #6c757d;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>{{ quiz.title }}</h2>
    <p class="note">Please answer all questions below and submit when finished.</p>

    <form method="post">
        {% csrf_token %}
        {% for question in questions %}
            <div class="question">
                <h4>Q{{ forloop.counter }}. {{ question.text }}</h4>
                {% for choice in question.choices.all %}
                    <div class="choice">
                        <label>
                            <input type="radio" name="question_{{ question.id }}" value="{{ choice.id }}">
                            {{ choice.text }}
                        </label>
                    </div>
                {% endfor %}
            </div>
        {% endfor %}
        <button type="submit">Submit Quiz</button>
    </form>
</div>
</body>
</html>
