{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ quiz.title }} - Take Quiz</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #343a40;
            margin-bottom: 20px;
        }
        .question {
            margin-bottom: 30px;
        }
        .question h4 {
            margin-bottom: 10px;
        }
        .choice {
            margin-bottom: 8px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .note {
            color: #6c757d;
            margin-bottom: 30px;
        }

        /* Webcam top-right */
        #webcam-preview {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border: 2px solid #007bff;
            border-radius: 8px;
            overflow: hidden;
            z-index: 1000;
            background: black;
        }

        #webcam-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>{{ quiz.title }}</h2>
    <p class="note">Please answer all questions below and submit when finished.</p>

    <form method="post">
        {% csrf_token %}
        {% for question in questions %}
            <div class="question">
                <h4>Q{{ forloop.counter }}. {{ question.text }}</h4>
                {% for choice in question.choices.all %}
                    <div class="choice">
                        <label>
                            <input type="radio" name="question_{{ question.id }}" value="{{ choice.id }}">
                            {{ choice.text }}
                        </label>
                    </div>
                {% endfor %}
            </div>
        {% endfor %}
        <button type="submit">Submit Quiz</button>
    </form>
</div>

<!-- Webcam preview in top-right corner -->
<div id="webcam-preview">
    <video id="video" autoplay muted></video>
</div>

<!-- Hidden canvas for face capture -->
<canvas id="canvas" style="display:none;"></canvas>

<script>
    // Get CSRF token from cookie
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    // Get webcam stream
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            alert("Webcam access denied. You cannot take the quiz.");
        });

    // Capture image and send to server for verification
    function verifyFace() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const imageData = canvas.toDataURL('image/jpeg');

        fetch("{% url 'verify_face' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken
            },
            body: JSON.stringify({ image: imageData })
        })
        .then(res => res.json())
        .then(data => {
            if (!data.valid) {
                alert("Face does not match your registered identity. You will be logged out.");
                window.location.href = "{% url 'logout' %}";
            }
        })
        .catch(err => console.error("Verification error:", err));
    }

    // Start verifying face every 20 seconds
    setInterval(verifyFace, 20000);
</script>

</body>
</html>
