{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen flex items-center justify-center bg-gradient-to-r from-white to-blue-400 text-white">

    <div class="bg-gray-600 bg-opacity-60 p-10 rounded-2xl shadow-2xl max-w-xl w-full flex flex-col items-center space-y-6 text-center transform transition-all duration-500 hover:scale-105">
        <img src="{% static 'images/miit-logo.png' %}" alt="MIIT Logo" class="w-32 h-auto mb-4 animate-bounce-slow">
        <h1 class="text-4xl font-bold animate-fadeIn">Welcome to MIIT Proctoring System</h1>
        <p class="text-lg animate-fadeIn animate-delay-100">Your secure online examination platform.</p>

        <!-- Stacked Buttons -->
        <div class="flex flex-col space-y-4 mt-4 w-full items-center">
            <a href="{% url 'login' %}" 
               class="px-6 py-3 bg-blue-400 hover:bg-blue-600 rounded-lg font-semibold transition transform hover:-translate-y-1 hover:scale-105 w-48 text-center">
               Login
            </a>
            <a href="{% url 'admin' %}" 
               class="px-6 py-3 bg-blue-400 hover:bg-blue-600 rounded-lg font-semibold transition transform hover:-translate-y-1 hover:scale-105 w-48 text-center">
               Login to Admin
            </a>
        </div>
    </div>

    <style>
        /* Custom Tailwind Animations */
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 3s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 1s forwards;
        }
        .animate-delay-100 {
            animation-delay: 0.3s;
        }
    </style>

</body>
</html>
