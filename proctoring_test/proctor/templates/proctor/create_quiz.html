{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8 space-y-6">

    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-lg p-6 shadow-lg animate-fadeIn">
        <h1 class="text-2xl md:text-3xl font-bold">Create New Quiz</h1>
        <p class="text-blue-100 mt-2">Fill in the details to set up your quiz</p>
    </div>

    <!-- Form -->
    <div class="bg-white rounded-lg shadow-lg p-6 animate-fadeIn">
        <form method="post" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {% csrf_token %}

            <div>
                <label class="block text-gray-700 font-medium mb-2">Quiz Title</label>
                <input type="text" name="title" required
                       class="w-full rounded-lg border border-black focus:ring-2 focus:ring-blue-500 focus:border-black h-8">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-2">Number of Questions</label>
                <input type="number" name="question_count" min="1" required
                       class="w-full rounded-lg border border-black focus:ring-2 focus:ring-blue-500 focus:border-black h-8">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-2">Time Limit (in minutes)</label>
                <input type="number" name="time_limit" min="1" required
                       class="w-full rounded-lg border border-black focus:ring-2 focus:ring-blue-500 focus:border-black h-8">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-2">Open Date & Time</label>
                <input type="datetime-local" name="open_date" required
                       class="w-full rounded-lg border border-black focus:ring-2 focus:ring-blue-500 focus:border-black h-8">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-2">Close Date & Time</label>
                <input type="datetime-local" name="close_date" required
                       class="w-full rounded-lg border border-black focus:ring-2 focus:ring-blue-500 focus:border-black h-8">
            </div>


            <div class="col-span-1 md:col-span-2 pt-4 flex justify-center">
                <button type="submit"
                        class="w-full md:w-auto px-6 py-2 bg-blue-600 text-white font-medium rounded-lg shadow-md hover:bg-blue-700 transition duration-200">
                    Create Quiz
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
