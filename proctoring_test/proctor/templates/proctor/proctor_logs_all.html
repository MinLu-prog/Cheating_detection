{% extends "base.html" %}
{% block content %}
<h2 class="text-xl font-semibold mb-4">Proctoring Logs — All Exams</h2>

<form method="get" class="mb-4 flex gap-2 items-end">
  <div>
    <label class="block text-xs text-gray-600">Exam</label>
    <select name="quiz" class="border rounded px-2 py-1">
      <option value="all" {% if selected_quiz == "all" %}selected{% endif %}>All</option>
      {% for q in quizzes %}
        <option value="{{ q.id }}" {% if selected_quiz|stringformat:"s" == q.id|stringformat:"s" %}selected{% endif %}>{{ q.title }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-xs text-gray-600">Student</label>
    <input name="student" value="{{ request.GET.student }}" class="border rounded px-2 py-1">
  </div>
  <div>
    <label class="block text-xs text-gray-600">Type</label>
    <input name="type" value="{{ request.GET.type }}" class="border rounded px-2 py-1">
  </div>
  <button class="px-3 py-2 bg-gray-700 text-white rounded">Filter</button>
</form>

<div class="overflow-x-auto bg-white shadow rounded">
  <table class="min-w-full text-sm">
    <thead class="bg-gray-100 sticky top-0">
      <tr>
        <th class="px-3 py-2 text-left">Time</th>
        <th class="px-3 py-2 text-left">Exam</th>
        <th class="px-3 py-2 text-left">Student</th>
        <th class="px-3 py-2 text-left">Type</th>
        <th class="px-3 py-2 text-left">Severity</th>
        <th class="px-3 py-2 text-left">Message</th>
        <th class="px-3 py-2 text-left">Snapshot</th>
      </tr>
    </thead>
    <tbody>
      {% include "proctor/_proctor_rows.html" with events=events %}
    </tbody>
  </table>
</div>
{% endblock %}
