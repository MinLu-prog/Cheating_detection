{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h4>Adding Question {{ current_question }} of {{ total_questions }}</h4>
    
    <form method="post" class="mt-4">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Question Text</label>
            <textarea name="question" class="form-control" rows="3" required></textarea>
        </div>
        
        {% for i in "1234" %}
        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="correct" 
                       value="{{ forloop.counter0 }}" required>
                <label class="form-check-label">Answer {{ i }}</label>
                <input type="text" name="answer{{ i }}" class="form-control" required>
            </div>
        </div>
        {% endfor %}
        
        <button type="submit" class="btn btn-primary">
            {% if current_question == total_questions %}Finish{% else %}Next Question{% endif %}
        </button>
    </form>
</div>
{% endblock %}
