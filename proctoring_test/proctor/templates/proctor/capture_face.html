{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Capture Face</h2>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Start Face Capture</button>
    </form>
</div>
{% endblock %}
